name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          # Locate built release APK
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-output/Zombie-Survival-Last-City-v1.0-release.apk
            echo "Release APK copied successfully: $RELEASE_APK"
          else
            echo "Release APK not found in expected folder, searching everywhere..."
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} build-output/Zombie-Survival-Last-City-v1.0.apk \;
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zombie-Survival-Last-City-APK
          path: build-output/*.apk
          retention-days: 30

      - name: Publish GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/*.apk
          name: "Zombie Survival: Last City ${{ github.ref_name }}"
          body: |
            ## Zombie Survival: Last City - Android Release
            
            - **Package ID**: `com.zombiesurvival.lastcity`
            - **Build Type**: Release APK (Signed and ready for installation)
            - **AdMob**: Pre-configured with Google Mobile Ads SDK
            
            ### Installation:
            1. Download `Zombie-Survival-Last-City-v1.0-release.apk`
            2. Open the APK on your Android smartphone
            3. Allow installation from unknown sources if prompted
            4. Enjoy the full-screen survival action game!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
